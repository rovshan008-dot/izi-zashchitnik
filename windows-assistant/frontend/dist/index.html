<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Изи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- ЭКРАН ВХОДА -->
  <section id="screen-login" class="screen">
    <div class="orb-wrap">
      <div class="orb" id="login-orb"></div>
    </div>
    <h1 class="title">Привет. Я Изи.</h1>
    <p class="hint">Чтобы я тебя узнал, напиши <b>/web</b> боту <b>@IZI20bot</b> и введи код.</p>
    <div class="code-row" id="code-row">
      <input id="code-input" class="code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
      <div class="code-boxes" id="code-boxes">
        <span class="code-box"></span><span class="code-box"></span><span class="code-box"></span>
        <span class="code-box"></span><span class="code-box"></span><span class="code-box"></span>
      </div>
    </div>
    <p class="error" id="login-error"></p>
    <div class="spinner" id="login-spinner" hidden></div>
  </section>

  <!-- ЭКРАН ЧАТА -->
  <section id="screen-chat" class="screen chat-screen" hidden>
    <header class="header">
      <div class="orb small" id="header-orb"></div>
      <span class="brand">Изи</span>
      <nav class="tabs">
        <button id="tab-chat-btn" class="tab-btn active" data-tab="chat">Чат</button>
        <button id="tab-drop-btn" class="tab-btn" data-tab="drop">Перенос</button>
      </nav>
      <button id="menu-btn" class="icon-btn" title="Меню" aria-label="Меню">⋮</button>
      <div id="menu" class="menu" hidden>
        <button id="logout-btn" class="menu-item">Выйти</button>
      </div>
    </header>

    <!-- вкладка: чат -->
    <div id="tab-chat" class="tab-pane">
      <div id="messages" class="messages"></div>

      <div class="composer">
        <button id="mic-btn" class="mic-btn" title="Записать голос">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
            <path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/>
          </svg>
        </button>
        <input id="text-input" class="text-input" placeholder="Напиши Изи…" autocomplete="off" />
        <button id="send-btn" class="send-btn" title="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div id="rec-indicator" class="rec-indicator" hidden>Слушаю… отпусти, чтобы остановить</div>
    </div>

    <!-- вкладка: перенос -->
    <div id="tab-drop" class="tab-pane" hidden>
      <div class="drop-scroll">
        <h2 class="drop-h">Телефон ↔ Компьютер</h2>

        <div id="drop-zone" class="drop-zone">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
          </svg>
          <p>Перетащи фото, видео или файл</p>
          <p class="drop-sub">До 50 МБ</p>
        </div>

        <div class="drop-text-row">
          <input id="drop-text-input" class="text-input" placeholder="Ссылка или текст для телефона" autocomplete="off" />
          <button id="drop-send-btn" class="send-btn" title="Отправить">Отправить</button>
        </div>

        <h3 class="drop-h2">ПРИШЛО С ТЕЛЕФОНА</h3>
        <div id="drop-list" class="drop-list">
          <p class="drop-empty" id="drop-empty">Пока ничего нет — пришли что-нибудь с телефона боту @IZI20bot, и оно появится здесь.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- диалог "Куда это?" при перетаскивании фото -->
  <div id="drop-dialog" class="modal" hidden>
    <div class="modal-card">
      <p class="modal-title" id="drop-dialog-title">Куда это?</p>
      <button id="drop-dialog-phone" class="modal-item">На телефон</button>
      <button id="drop-dialog-ask" class="modal-item">Спросить Изи про это фото</button>
      <button id="drop-dialog-cancel" class="modal-item modal-cancel">Отмена</button>
    </div>
  </div>

</main>
<audio id="player" hidden></audio>
<script src="app.js"></script>
</body>
</html>
